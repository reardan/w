<!DOCTYPE html>
<!-- Browser host for W wasm graphics programs (docs/projects/wasm_webgl.md).

     Serve the repository root and open this page with the module to run:

       ./bin/wv2 wasm graphics/demo_web.w -o bin/graphics_demo.wasm
       python3 -m http.server 8000
       # -> http://localhost:8000/tools/web/?module=/bin/graphics_demo.wasm

     The page instantiates the module with the WASI-lite shim (stdout to
     the console and the log pane) and the WebGL2 env glue, runs _start
     (setup), then drives the registered frame callback from
     requestAnimationFrame until it returns 0 (read from the exported
     $ax global). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>W wasm graphics host</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #14161c; color: #d6d8de; font: 14px/1.4 monospace; }
  #wrap { position: fixed; left: 0; top: 0; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display: block; background: #000; touch-action: none; outline: none; }
  #text-input { position: fixed; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0.01; font-size: 16px; resize: none; pointer-events: none; }
  #log { width: min(640px, 100%); max-height: 8em; overflow-y: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; color: #9aa0ad; }
  #log .err { color: #e08080; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <div id="log" role="log"></div>
</div>
  <textarea id="text-input" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="W text editor"></textarea>
<script type="module">
import { makeEnv } from './webgl_env.mjs';
import { makeWasi } from './wasi_lite.mjs';
import { createInput, viewportSize, createEventQueue } from './mobile_input.mjs';

const logPane = document.getElementById('log');
const log = (text, cls) => {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  logPane.appendChild(line);
  logPane.scrollTop = logPane.scrollHeight;
};

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2');
if (!gl) log('this browser has no WebGL2 context', 'err');

// ------------------------------ canvas host ------------------------------
const state = {
  shouldClose: 0, mouseX: 0, mouseY: 0, mouseButtons: 0, lastKeycode: 0,
};

// The queue is drained synchronously by the W frame. Do not silently drop
// Unicode commits or pointer release events when pasting a long string.
const events = createEventQueue();
const pushEvent = (...args) => events.push(...args);
let frameCallback = 0;
let running = false;
let inFrame = false;
let requestedWidth = 640;
let requestedHeight = 480;
let size = { width: 640, height: 480, ratio: 1 };
const resize = () => {
  const viewport = window.visualViewport;
  const wrap = document.getElementById('wrap');
  wrap.style.width = `${viewport?.width ?? innerWidth}px`;
  wrap.style.transform = `translate(${viewport?.offsetLeft ?? 0}px, ${viewport?.offsetTop ?? 0}px)`;
  const padding = getComputedStyle(wrap);
  size = viewportSize({ width: viewport?.width ?? innerWidth,
    height: viewport?.height ?? innerHeight, requestedWidth, requestedHeight,
    insetLeft: parseFloat(padding.paddingLeft) || 0,
    insetRight: parseFloat(padding.paddingRight) || 0,
    insetTop: parseFloat(padding.paddingTop) || 0,
    insetBottom: parseFloat(padding.paddingBottom) || 0, dpr: devicePixelRatio });
  canvas.style.width = `${size.width}px`;
  canvas.style.height = `${size.height}px`;
  if (canvas.width !== size.bufferWidth) canvas.width = size.bufferWidth;
  if (canvas.height !== size.bufferHeight) canvas.height = size.bufferHeight;
};
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);
window.visualViewport?.addEventListener('scroll', resize);
const runFrame = () => {
  if (!running || inFrame || !instance || !frameCallback) return;
  inFrame = true;
  try {
    resize();
    events.beginFrame();
    instance.exports.table.get(frameCallback)();
    if (instance.exports.ax.value === 0) {
      running = false;
      log('frame callback returned 0; stopped');
    }
  } finally { inFrame = false; }
};
const input = createInput({ canvas, editor: document.getElementById('text-input'),
  state, pushEvent, flushFrame: runFrame });
const host = {
  canvasInit: (title, width, height) => {
    if (!gl) return 0;
    document.title = title;
    requestedWidth = width;
    requestedHeight = height;
    resize();
    return 1;
  },
  pollState: () => ({ width: size.width, height: size.height, ...state }),
  pixelRatio: () => size.ratio,
  textInput: (...args) => input.setTextInput(...args),
  pointerMode: mode => input.setPointerMode(mode),
  setFrameCallback: tableIndex => { frameCallback = tableIndex; },
  nextEvent: () => events.next(),
};

// --------------------------------- run -----------------------------------
const moduleUrl = new URLSearchParams(location.search).get('module')
  ?? '../../bin/graphics_demo.wasm';
let instance = null;
const wasi = makeWasi({
  memory: () => instance.exports.memory,
  onWrite: (fd, text) => {
    (fd === 2 ? console.error : console.log)(text);
    log(text.replace(/\n$/, ''), fd === 2 ? 'err' : '');
  },
});
const env = makeEnv({ memory: () => instance.exports.memory, gl, host });

try {
  const wasm = await WebAssembly.compileStreaming(fetch(moduleUrl));
  instance = await WebAssembly.instantiate(wasm, {
    wasi_snapshot_preview1: wasi.imports,
    env,
  });
  const code = wasi.runStart(instance);
  log(`_start returned (exit ${code})`);
  if (frameCallback !== 0) {
    running = true;
    const tick = () => {
      runFrame();
      if (running) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
} catch (e) {
  log(String(e), 'err');
  throw e;
}
</script>
</body>
</html>
