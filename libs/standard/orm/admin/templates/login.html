{% extends "base.html" %}
{% block content %}
{% if error %}<p class="errornote">{{ error }}</p>{% endif %}
{% if denied %}<p class="errornote">You are authenticated as {{ user.username }}, but are not authorized to access this page. Would you like to login to a different account?</p>{% endif %}
<form method="post" action="{{ action }}" id="login-form">{% csrf_token %}
<p><label for="id_username">Username:</label> <input type="text" name="username" id="id_username" value="{{ username }}" maxlength="150" autofocus required></p>
<p><label for="id_password">Password:</label> <input type="password" name="password" id="id_password" required></p>
<p><input type="submit" value="Log in"></p>
</form>
{% endblock %}
