name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux legs reuse a content-keyed seed/bootstrap cache (setup-w); later
# fixpoint stages and tests still run on every job. Each leg runs an
# umbrella or benchmark target from the manifest.
# `./wbuild manifest_check` (part of `tests`) fails when a target belongs
# to no umbrella, so a new target cannot silently fall out of CI.
#
# W_CI_NO_SKIP=1 turns host-capability skips (no display, no /dev/kvm,
# no interop peer, a piped core_pattern; see lib/ci_skip.w) into
# failures: each leg installs what its tests need, so a SKIP there means
# the leg is broken. Opt-in suites that need explicit configuration
# (WVM_TEST_KERNEL, WVM_TEST_CGROUP) still print SKIP; the "Report
# skips" step counts every SKIP line into the job summary.
env:
  W_CI_NO_SKIP: "1"

jobs:
  tests:
    name: full test shard ${{ matrix.part }}/4
    runs-on: [self-hosted, linux, x64, w-aws-pilot]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [0]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up cached W bootstrap
        uses: ./.github/actions/setup-w

      - name: Install 32-bit runtime, Valgrind, Xvfb and Mesa
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libc6:i386 valgrind xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Allow debugger attach tests
        run: sudo sysctl --write kernel.yama.ptrace_scope=0

      # wcore_test needs core files in the crashing process's cwd; the
      # runner's default core_pattern pipes them to a handler.
      - name: Write core files to the working directory
        run: sudo sysctl --write kernel.core_pattern=core

      # The wvm/kvm tests need a usable /dev/kvm (the hosted runners
      # expose it on most machines, but only to root by default). A
      # runner without one sets W_CI_NO_KVM, which lets those tests
      # skip (lib/ci_skip.w test_skip_kvm) instead of failing the leg.
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM enabled"
          else
            echo "::warning::/dev/kvm is not available on this runner; KVM tests will skip"
            echo "W_CI_NO_KVM=1" >> "$GITHUB_ENV"
          fi

      - name: Build and test shard (GL and UI tests on Xvfb)
        env:
          TEST_PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            ./wbuild --shard "$TEST_PART/4" --timings bin/ci-timings.jsonl \
            tests tests_interop 2>&1 | tee wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report slowest targets
        if: always()
        run: |
          {
            echo '### Target timings'
            echo '```text'
            grep -a -A 10 '^wexec: elapsed .*slowest targets:' wbuild.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shard log and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-full-${{ matrix.part }}
          path: |
            wbuild.log
            bin/ci-timings.jsonl
          retention-days: 14

