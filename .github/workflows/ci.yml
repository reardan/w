name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every leg bootstraps from the pinned seed (`./wbuild` downloads and
# sha256-checks it) and runs one umbrella from the generated manifest.
# `./wbuild manifest_check` (part of `tests`) fails when a target belongs
# to no umbrella, so a new target cannot silently fall out of CI.
#
# W_CI_NO_SKIP=1 turns host-capability skips (no display, no /dev/kvm,
# no interop peer, a piped core_pattern; see lib/ci_skip.w) into
# failures: each leg installs what its tests need, so a SKIP there means
# the leg is broken. Opt-in suites that need explicit configuration
# (WVM_TEST_KERNEL, WVM_TEST_CGROUP) still print SKIP; the "Report
# skips" step counts every SKIP line into the job summary.
env:
  W_CI_NO_SKIP: "1"

jobs:
  tests:
    name: Full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install 32-bit runtime, Xvfb and Mesa
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libc6:i386 xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Allow debugger attach tests
        run: sudo sysctl --write kernel.yama.ptrace_scope=0

      # wcore_test needs core files in the crashing process's cwd; the
      # runner's default core_pattern pipes them to a handler.
      - name: Write core files to the working directory
        run: sudo sysctl --write kernel.core_pattern=core

      # The wvm/kvm tests need a usable /dev/kvm (the hosted runners
      # expose it on most machines, but only to root by default). A
      # runner without one sets W_CI_NO_KVM, which lets those tests
      # skip (lib/ci_skip.w test_skip_kvm) instead of failing the leg.
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM enabled"
          else
            echo "::warning::/dev/kvm is not available on this runner; KVM tests will skip"
            echo "W_CI_NO_KVM=1" >> "$GITHUB_ENV"
          fi

      - name: Build and test (GL and UI tests on Xvfb)
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            ./wbuild tests tests_interop 2>&1 | tee wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  arm64:
    name: arm64 (qemu-user)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Dynamically linked arm64 tests (dynamic_test_arm64,
      # float_abi_test_arm64) load the cross libc through this prefix.
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qemu-user and the arm64 libc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user-static libc6-arm64-cross

      # tests_arm64 = verify_arm64 (stage-2 self-recompile under qemu)
      # plus every arm64 run target. memfd_test_arm64 sits in
      # tests_arm64_native instead: qemu-user accepts an invalid
      # madvise advice that a real arm64 kernel rejects.
      - name: Build and test
        run: |
          set -o pipefail
          ./wbuild tests_arm64 2>&1 | tee wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  win64:
    name: win64 (wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WINEDEBUG: "-all"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install wine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wine

      # tests_win64 = verify_win (wv3_win == wv4_win == wv5_win under
      # wine) plus the win64 run targets.
      - name: Build and test
        run: |
          set -o pipefail
          ./wbuild tests_win64 2>&1 | tee wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  wasm:
    name: wasm32 (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bin/wrun runs WASI modules on node's built-in WASI when wasmtime
      # is absent, and the host-import / WebGL stubs need node itself.
      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # tests_wasm = verify_wasm, wasm_smoke_test, wasm_json_test,
      # wasm_extern_test, wasm_export_test, wasm_webgl_test,
      # wasm_ui_test and the generated wasm twins.
      - name: Build and test
        run: |
          set -o pipefail
          ./wbuild tests_wasm 2>&1 | tee wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  # The pinned w_darwin seed can segfault compiling today's sources on
  # current macOS runners (see release.yml), so, as the release does,
  # cross-compile an arm64_darwin bootstrap on Linux and hand it to the
  # macOS job together with the Mach-O test binaries that
  # tools/mac/run_darwin_tests.sh runs (Linux only cross-compiles them).
  darwin_cross:
    name: darwin cross-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cross-compile the bootstrap and the darwin test binaries
        run: |
          ./wbuild wv2 arm64_darwin_smoke_test crash_darwin graphics_darwin \
            graphics_cocoa_input_darwin net_darwin pac_darwin
          ./bin/wv2 arm64_darwin w.w -o bin/wv2_darwin_bootstrap
          # tar keeps the executable bits that upload-artifact drops.
          tar -czf darwin_bins.tgz bin/wv2_darwin_bootstrap bin/*darwin*test \
            bin/graphics_gl_smoke_darwin bin/graphics_cocoa_input_darwin \
            bin/net_darwin bin/crash_darwin_fixture bin/crash_darwin_pac_fixture

      - name: Upload darwin binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin_bins
          path: darwin_bins.tgz
          retention-days: 3

  darwin:
    name: darwin fixpoint and native tests
    needs: [darwin_cross]
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download darwin binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin_bins

      - name: Install the bootstrap as w_darwin
        run: |
          tar -xzf darwin_bins.tgz
          # Fresh inode (cp + mv) so macOS's vnode signature cache does
          # not see a stale codesign; wbuild uses a w_darwin whose hash
          # differs from SEEDS as-is.
          cp bin/wv2_darwin_bootstrap w_darwin.new
          mv -f w_darwin.new w_darwin
          chmod +x w_darwin

      # tests_darwin = verify_darwin (build_darwin's wv3_darwin ==
      # wv4_darwin fixpoint).
      - name: Verify the darwin self-host fixpoint
        run: |
          set -o pipefail
          ./wbuild tests_darwin 2>&1 | tee wbuild.log

      - name: Run the Mach-O tests natively
        run: |
          set -o pipefail
          tools/mac/run_darwin_tests.sh 2>&1 | tee -a wbuild.log

      - name: Report skips
        if: always()
        run: |
          touch wbuild.log
          n=$(grep -ac 'SKIP' wbuild.log || true)
          echo "SKIP lines: $n"
          {
            echo "### SKIP lines: $n"
            grep -a 'SKIP' wbuild.log | sort | uniq -c | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
